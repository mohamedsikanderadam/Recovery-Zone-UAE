<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Contrast Bath placeholder">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8e6e0"/>
      <stop offset="1" stop-color="#cfd6d2"/>
    </linearGradient>
    <pattern id="p" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="14" height="14" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="#0f3b36" stroke-opacity=".05" stroke-width="6"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="url(#g)"/>
  <rect width="1200" height="900" fill="url(#p)"/>
  <rect x="40" y="40" width="1120" height="820" fill="none" stroke="#0f3b36" stroke-opacity=".22" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="50%" y="440" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="65" font-weight="700" letter-spacing="3.9" fill="#0f3b36" fill-opacity=".62">CONTRAST BATH</text>
  <text x="50%" y="490" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#0f3b36" fill-opacity=".45">Client moving sauna to ice bath</text>
  <text x="50%" y="541" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="600" letter-spacing="3" fill="#0f3b36" fill-opacity=".3">PHOTOGRAPHY PENDING</text>
</svg>
