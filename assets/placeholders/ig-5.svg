  <rect x="36" y="36" width="728" height="728" fill="none" stroke="#0f3b36" stroke-opacity=".22" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="50%" y="391" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="3.5" fill="#0f3b36" fill-opacity=".62">INSTAGRAM</text>
